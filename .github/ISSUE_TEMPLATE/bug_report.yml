name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CamTrap Verify version
      description: Shown next to the title in the app, or the release you installed.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS, Docker, Other]
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options: [CamtrapDP, DeepFaune, Custom CSV, Trapper]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please do not paste private data or credentials.
